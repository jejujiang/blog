      {% for word in site.data.words %}
      <div class="row">
        <div class="col-4 offset-4">
          <div class="card" style="width: 20rem;">
            <div class="card-body">
              <h4 class="card-title">{{ word.en}}</h4>
              <h5 class="card-subtitle">english</h5>
              <p class="card-text">{{ word.zh }}</p>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
